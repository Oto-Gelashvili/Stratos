<div #menu>
  <span tabindex="0" class="material-symbols-outlined menuSpan"> menu </span>
  @if (isMenuShown$ | async) {
    <div class="menu" animate.enter="enter-animation" animate.leave="leave-animation">
      <ul>
        <li class="themeLi">
          <p class="username">Guest</p>
          <app-theme-switcher class="menuSwitcher"></app-theme-switcher>
        </li>
        @for (link of navService.links; track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="active-link">
              <p>{{ link.label }}</p>
              <span class="material-symbols-outlined themeSpan">{{ link.icon }}</span>
            </a>
          </li>
        }
        <li>
          <div class="btnCont"><button class="signBtn">Register</button></div>
        </li>
      </ul>
    </div>
  }
</div>
